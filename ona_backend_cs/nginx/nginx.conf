# Single entry point (port 8080 on the host): API calls by path, everything else = the static web UI.

server {
    listen 80;
    # Docker DNS: re-resolve container names so recreated containers are found (no stale IPs).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $graph     http://graph-api:8080;
    set $identity  http://identity-api:8080;
    set $analysis  http://analysis-api:8080;
    set $insights  http://insights-api:8080;

    client_max_body_size 50m;            # employee CSV uploads (nginx default is 1m)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- ONA APIs ---
    location ~ ^/api/v1/(boards|nodes|connections|data)(/|$) { proxy_pass $graph; }
    location ~ ^/api/v1/users(/|$)                           { proxy_pass $identity; }
    location ~ ^/api/v1/analysis-runs(/|$)                   { proxy_pass $analysis; }
    location ~ ^/api/v1/recommendations(/|$)                 { proxy_pass $insights; }

    # --- Web UI (static files from ./frontend) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

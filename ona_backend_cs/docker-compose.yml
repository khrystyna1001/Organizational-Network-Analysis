services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ona_graph}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-local_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zookeeper"] # srvr is on ZooKeeper's default four-letter whitelist (ruok is not)
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  mailpit: # catches password-reset emails: http://localhost:8025
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  graph-api:
    build:
      context: .
      args:
        SERVICE: Graph
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      Jwt__Key: "${JWT_KEY:-ona-dev-signing-key-change-me-0123456789abcdef}"
      Kafka__BootstrapServers: "kafka:29092"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}" # enables /scalar/v1 and /openapi/v1.json
      ConnectionStrings__Graph: "Server=mysql;Port=3306;Database=ona_graph;User Id=root;Password=${MYSQL_ROOT_PASSWORD:-local_root_password}"

  identity-api:
    build:
      context: .
      args:
        SERVICE: Identity
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      Jwt__Key: "${JWT_KEY:-ona-dev-signing-key-change-me-0123456789abcdef}"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__From: "no-reply@ona.local"
      Admin__Password: "${ADMIN_PASSWORD:-Admin123!}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}" # enables /scalar/v1 and /openapi/v1.json
      ConnectionStrings__Identity: "Server=mysql;Port=3306;Database=ona_identity;User Id=root;Password=${MYSQL_ROOT_PASSWORD:-local_root_password}"

  analysis-api:
    build:
      context: .
      args:
        SERVICE: Analysis
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      graph-api:
        condition: service_started
    environment:
      Jwt__Key: "${JWT_KEY:-ona-dev-signing-key-change-me-0123456789abcdef}"
      Kafka__BootstrapServers: "kafka:29092"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}" # enables /scalar/v1 and /openapi/v1.json
      ConnectionStrings__Analysis: "Server=mysql;Port=3306;Database=ona_analysis;User Id=root;Password=${MYSQL_ROOT_PASSWORD:-local_root_password}"
      Services__Graph__BaseUrl: "http://graph-api:8080"

  insights-api:
    build:
      context: .
      args:
        SERVICE: Insights
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      analysis-api:
        condition: service_started
    environment:
      Jwt__Key: "${JWT_KEY:-ona-dev-signing-key-change-me-0123456789abcdef}"
      Kafka__BootstrapServers: "kafka:29092"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}" # enables /scalar/v1 and /openapi/v1.json
      ConnectionStrings__Insights: "Server=mysql;Port=3306;Database=ona_insights;User Id=root;Password=${MYSQL_ROOT_PASSWORD:-local_root_password}"
      Services__Analysis__BaseUrl: "http://analysis-api:8080"

  proxy:
    image: nginx:alpine # only published web entry point: http://localhost:8080
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro # static web UI
    depends_on:
      - graph-api
      - identity-api
      - analysis-api
      - insights-api
    ports:
      - "8080:80"

volumes:
  mysql-data:
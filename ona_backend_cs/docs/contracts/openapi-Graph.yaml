    post:
      tags:
        - Boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/BoardDto"
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDto"
            text/json:
              schema:
                $ref: "#/components/schemas/BoardDto"
        "422":
          description: Unprocessable Entity
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags:
        - Boards
      responses:
        "200":
          description: OK
          content:

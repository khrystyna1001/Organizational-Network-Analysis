components:
  schemas:
    BoardDto:
      required:
        - id
        - name
        - description
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - "null"
            - string
        lifecycle:
          type: string
          default: Draft
        currentGraphVersionId:
          type:
            - "null"
            - string
        nodeCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          default: 0
        connectionCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          default: 0
    ConnectionDto:
      required:
        - id
        - boardId
        - sourceNodeId
        - targetNodeId
        - weight
      type: object
      properties:
        id:
          type: string
        boardId:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        weight:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
    CreateBoardRequest:
      type: object
      properties:
        name:
          type:
            - "null"
            - string
        description:
          type:
            - "null"
            - string
    CreateConnectionRequest:
      required:
        - boardId
      type: object
      properties:
        boardId:
          type: string
        sourceNodeId:
          type:
            - "null"
            - string
        targetNodeId:
          type:
            - "null"
            - string
        weight:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
    CreateNodeRequest:
      required:
        - boardId
      type: object
      properties:
        boardId:
          type: string
        name:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        department:
          type:
            - "null"
            - string
    ImportedMemberDto:
      required:
        - employeeId
        - name
        - title
        - department
        - supervisorEmployeeId
      type: object
      properties:
        employeeId:
          type: string
        name:
          type: string
        title:
          type: string
        department:
          type: string
        supervisorEmployeeId:
          type:
            - "null"
            - string
    NodeDto:
      required:
        - id
        - boardId
        - name
        - title
        - department
      type: object
      properties:
        id:
          type: string
        boardId:
          type: string
        name:
          type: string
        title:
          type: string
        department:
          type: string
    OrganizationDataResponse:
      required:
        - status
        - totalRows
        - data
        - boardId
        - nodesCreated
        - connectionsCreated
      type: object
      properties:
        status:
          type: string
        totalRows:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImportedMemberDto"
        boardId:
          type: string
        nodesCreated:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        connectionsCreated:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        detail:
          type:
            - "null"
            - string
        instance:
          type:
            - "null"
            - string
    UpdateBoardRequest:
      type: object
      properties:
        name:
          type:
            - "null"
            - string
        description:
          type:
            - "null"
            - string
    UpdateConnectionRequest:
      type: object
      properties:
        weight:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
    UpdateNodeRequest:
      type: object
      properties:
        name:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        department:
          type:
            - "null"
            - string
tags:
  - name: Boards
  - name: Connections
  - name: Health
  - name: Nodes
  - name: OrganizationImport

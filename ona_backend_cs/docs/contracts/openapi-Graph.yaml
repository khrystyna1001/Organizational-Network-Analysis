            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/data:
    post:
      tags:
        - OrganizationImport
      summary: Import a people CSV as a new Draft board
      description: One row per person. Without `mapping` the HR export columns are expected
        (EmpID, FirstName, LastName, Title, DepartmentType, Supervisor).
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                board_name:
                  type: string
                mapping:
                  type: string
                  description: 'JSON, CSV header per role, e.g. {"full_name":"Name","supervisor":"Manager"}.
                    Roles: employee_id, full_name, first_name, last_name, title, department, supervisor.'
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Unprocessable Entity
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/data/preview:
    post:
      tags:
        - OrganizationImport
      summary: Columns, first rows and a suggested column mapping of a CSV. Nothing is saved.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvPreview"
        "400":
          description: Missing file or unreadable CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/users/login (Identity). Only Admin may DELETE a board.
  schemas:
    ColumnMapping:
      type: object
      description: CSV header name per role; null or blank = not mapped.
      properties:
        employee_id:
          type:
            - "null"
            - string
        full_name:
          type:
            - "null"
            - string
        first_name:
          type:
            - "null"
            - string
        last_name:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        department:
          type:
            - "null"
            - string
        supervisor:
          type:
            - "null"
            - string
    CsvPreview:
      type: object
      required:
        - columns
        - sample_rows
        - row_count
        - suggested_mapping
      properties:
        columns:
          type: array
          items:
            type: string
        sample_rows:
          type: array
          description: Up to 5 rows.
          items:
            type: array
            items:
              type: string
        row_count:
          type: integer
          format: int32
        suggested_mapping:
          $ref: "#/components/schemas/ColumnMapping"
    GraphSnapshotDto:
      type: object
      required:
        - board_id
        - graph_version_id
        - lifecycle
        - nodes
        - connections
      properties:
        board_id:
          type: string
        graph_version_id:
          type: string
        lifecycle:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeDto"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionDto"
    BoardDto:
      required:
        - id
        - name
        - description
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - "null"
            - string
        lifecycle:
          type: string
          default: Draft
        current_graph_version_id:
          type:
            - "null"
            - string
        node_count:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          default: 0
        connection_count:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          default: 0
    ConnectionDto:
      required:
        - id
        - board_id
        - source_node_id
        - target_node_id
        - weight
      type: object
      properties:
        id:
          type: string
        board_id:
          type: string
        source_node_id:
          type: string
        target_node_id:
          type: string
        weight:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
    CreateBoardRequest:
      type: object
      properties:
        name:
          type:
            - "null"
            - string
        description:
          type:
            - "null"
            - string
    CreateConnectionRequest:
      required:
        - board_id
      type: object
      properties:
        board_id:
          type: string
        source_node_id:
          type:
            - "null"
            - string
        target_node_id:
          type:
            - "null"
            - string
        weight:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
    CreateNodeRequest:
      required:
        - board_id
      type: object
      properties:
        board_id:
          type: string
        name:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        department:
          type:
            - "null"
            - string

  /api/v1/data:
    post:
      tags:
        - OrganizationImport
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              allOf:
                - type: object
                  properties:
                    ContentType:
                      type: string
                    ContentDisposition:
                      type: string
                    Headers:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
                    Length:
                      pattern: ^-?(?:0|[1-9]\d*)$
                      type:
                        - integer
                        - string
                      format: int64
                    Name:
                      type: string
                    FileName:
                      type: string
                - type: object
                  properties:
                    board_name:
                      type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            text/json:
              schema:

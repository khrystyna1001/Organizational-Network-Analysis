openapi: 3.1.0
info:
  title: ONA Graph Microservice API
  version: 1.0.0
  description: >-
    Public contract (Open Host Service / Published Language) of the ONA.Graph
    organization network microservice. The Analysis and Insights services consume
    graph snapshots and version data, as shown in the Context Map from Lab 3.
  contact:
    name: ONA Graph Team

servers:
  - url: http://localhost:5056
    description: Local environment (direct run)
  - url: http://graph-api:8080
    description: Docker Compose internal network (calls from Analysis, Insights)

tags:
  - name: Boards
    description: Board lifecycle and graph operations
  - name: Data Import
    description: HRIS CSV import and organization data

paths:
  /api/v1/boards:
    post:
      tags:
        - Boards
      operationId: createBoard
      summary: Creates a new organization network board
      description: >-
        Creates a new Draft board with a name. The board starts in Draft state
        and must be built from organization data before it can be published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
            examples:
              standardBoard:
                summary: Create a board for Engineering department
                value:
                  name: "Engineering Organization Network"
      responses:
        '201':
          description: Board created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
        '400':
          description: Input format validation error (e.g., empty or whitespace-only name)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Domain rule violation (e.g., name is too long)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      tags:
        - Boards
      operationId: getAllBoards
      summary: Lists all boards
      description: Returns a list of all boards with their current lifecycle state.
      responses:
        '200':
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardDto'

  /api/v1/boards/{boardId}:
    get:
      tags:
        - Boards
      operationId: getBoardById
      summary: Gets a board by its identifier
      description: Returns the board details including its current lifecycle state.
      parameters:
        - name: boardId
          in: path
          required: true
          description: Unique board identifier (BoardId)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Board details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
        '404':
          description: Board not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/boards/{boardId}/build:
    post:
      tags:
        - Boards
      operationId: buildBoardGraph
      summary: Builds the network graph from accepted organization data
      description: >-
        Transitions the board from Draft to Built state after validating that
        the graph contains at least one node and all connections are valid.
      parameters:
        - name: boardId
          in: path
          required: true
          description: Unique board identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Graph built successfully, board now in Built state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
        '404':
          description: Board not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Domain rule violation (e.g., empty graph, invalid connections)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/boards/{boardId}/snapshot:
    get:
      tags:
        - Boards
      operationId: getGraphSnapshot
      summary: Gets the immutable published graph snapshot
      description: >-
        Returns the current published graph version with all nodes and connections.
        Used by the Analysis service for metric calculations. Returns 404 if
        the board is not in Published state.
      parameters:
        - name: boardId
          in: path
          required: true
          description: Unique board identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Graph snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshotDto'
        '404':
          description: Board not found or not in Published state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/data:
    post:
      tags:
        - Data Import
      operationId: importBoardFromHris
      summary: Imports organization data from HRIS CSV export
      description: >-
        Parses an HRIS CSV export, validates employee data, and creates nodes
        and supervisor connections in a Draft board. This operation is idempotent
        when the same Idempotency-Key header is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: HRIS CSV export file
      responses:
        '200':
          description: Import processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrisImportResultDto'
        '400':
          description: Input format validation error (malformed CSV, missing required columns)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency conflict (same Idempotency-Key with different parameters)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Domain rule violation (invalid rows, duplicate employee IDs)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: External HRIS system temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key of the business operation (UUID) generated by the consumer.
        Protects against duplicate processing when HTTP requests are repeated.
      schema:
        type: string
        format: uuid

  schemas:
    CreateBoardRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Board name (Value Object BoardName, must not be empty or whitespace)

    BoardDto:
      type: object
      required:
        - boardId
        - name
        - lifecycle
        - currentGraphVersionId
        - createdAtUtc
        - updatedAtUtc
      properties:
        boardId:
          type: string
          format: uuid
          description: Unique board identifier
        name:
          type: string
          minLength: 1
          maxLength: 200
        lifecycle:
          $ref: '#/components/schemas/BoardLifecycle'
        currentGraphVersionId:
          type:
            - string
            - 'null'
          format: uuid
          description: Current published graph version ID, null if not yet published
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time

    BoardLifecycle:
      type: string
      enum:
        - Draft
        - Built
        - Published
        - Archived
      description: Board lifecycle state (State pattern from Lab 2)

    GraphSnapshotDto:
      type: object
      required:
        - boardId
        - graphVersionId
        - nodes
        - connections
        - snapshotAtUtc
      properties:
        boardId:
          type: string
          format: uuid
        graphVersionId:
          type: string
          format: uuid
          description: Immutable snapshot identifier
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeDto'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionDto'
        snapshotAtUtc:
          type: string
          format: date-time

    NodeDto:
      type: object
      required:
        - nodeId
        - boardId
        - name
        - title
        - department
      properties:
        nodeId:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Person name (Value Object NodeName)
        title:
          type: string
          minLength: 1
          maxLength: 200
        department:
          type: string
          minLength: 1
          maxLength: 200
          description: Department name (Value Object DepartmentName)

    ConnectionDto:
      type: object
      required:
        - connectionId
        - boardId
        - sourceNodeId
        - targetNodeId
        - weight
      properties:
        connectionId:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        sourceNodeId:
          type: string
          format: uuid
        targetNodeId:
          type: string
          format: uuid
        weight:
          type: number
          format: double
          minimum: 0.000001
          exclusiveMinimum: true
          description: Connection strength (Value Object ConnectionWeight, must be > 0 and finite)

    HrisImportResultDto:
      type: object
      required:
        - boardId
        - rowsProcessed
        - nodesCreated
        - connectionsCreated
        - processedAtUtc
      properties:
        boardId:
          type: string
          format: uuid
        rowsProcessed:
          type: integer
          minimum: 0
          description: Number of CSV rows processed (Value Object ImportedRowCount)
        nodesCreated:
          type: integer
          minimum: 0
        connectionsCreated:
          type: integer
          minimum: 0
        processedAtUtc:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: Standard HTTP error envelope compliant with RFC 9457
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          examples:
            - "https://ona.local/errors/board.invalid_name"
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
          description: Code of the domain exception (DomainException.Code, snake_case)

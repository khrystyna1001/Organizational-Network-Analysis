openapi: 3.1.0
info:
  title: ONA Analysis Microservice API
  version: 1.0.0
  description: >-
    Public contract (Open Host Service / Published Language) of the ONA.Analysis
    bottleneck detection microservice. The Insights service consumes analysis
    results for recommendation generation, as shown in the Context Map from Lab 3.
  contact:
    name: ONA Analysis Team

servers:
  - url: http://localhost:5139
    description: Local environment (direct run)
  - url: http://analysis-api:8080
    description: Docker Compose internal network (calls from Insights)

tags:
  - name: Analysis Runs
    description: Graph analysis and bottleneck detection operations

paths:
  /api/v1/analysis-runs:
    post:
      tags:
        - Analysis Runs
      operationId: startAnalysisRun
      summary: Starts a new analysis run for a published graph version
      description: >-
        Starts metric calculations and bottleneck detection for a specific
        GraphVersionId. The operation is idempotent when the same Idempotency-Key
        header is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRunRequest'
            examples:
              standardRun:
                summary: Analyze Engineering network graph
                value:
                  boardId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  graphVersionId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        '200':
          description: Analysis run started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '400':
          description: Input format validation error (invalid UUID format)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Graph version not found or board not in Published state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency conflict (same Idempotency-Key with different parameters)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Domain rule violation (analysis already in progress for this version)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Graph service temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      tags:
        - Analysis Runs
      operationId: getAllAnalysisRuns
      summary: Lists all analysis runs
      description: Returns a list of all analysis runs with their status.
      responses:
        '200':
          description: List of analysis runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisRunDto'

  /api/v1/analysis-runs/{analysisRunId}:
    get:
      tags:
        - Analysis Runs
      operationId: getAnalysisRunById
      summary: Gets an analysis run by its identifier
      description: Returns the analysis run details including metrics and bottleneck findings.
      parameters:
        - name: analysisRunId
          in: path
          required: true
          description: Unique analysis run identifier (AnalysisRunId)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analysis run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunDto'
        '404':
          description: Analysis run not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key of the business operation (UUID) generated by the consumer.
        Protects against duplicate analysis runs when HTTP requests are repeated.
      schema:
        type: string
        format: uuid

  schemas:
    StartAnalysisRunRequest:
      type: object
      additionalProperties: false
      required:
        - boardId
        - graphVersionId
      properties:
        boardId:
          type: string
          format: uuid
          description: Board identifier (from Graph context)
        graphVersionId:
          type: string
          format: uuid
          description: Immutable graph version identifier to analyze

    AnalysisRunDto:
      type: object
      required:
        - analysisRunId
        - boardId
        - graphVersionId
        - status
        - metrics
        - bottlenecks
        - startedAtUtc
        - completedAtUtc
      properties:
        analysisRunId:
          type: string
          format: uuid
          description: Unique analysis run identifier
        boardId:
          type: string
          format: uuid
        graphVersionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AnalysisRunStatus'
        metrics:
          $ref: '#/components/schemas/GraphMetrics'
        bottlenecks:
          type: array
          items:
            $ref: '#/components/schemas/BottleneckFinding'
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type:
            - string
            - 'null'
          format: date-time
          description: Completion timestamp, null if still running

    AnalysisRunStatus:
      type: string
      enum:
        - Pending
        - Running
        - Completed
        - Failed
      description: Analysis run lifecycle state

    GraphMetrics:
      type: object
      required:
        - nodeCount
        - connectionCount
        - averageDegree
        - density
      properties:
        nodeCount:
          type: integer
          minimum: 1
          description: Total number of nodes in the graph
        connectionCount:
          type: integer
          minimum: 0
          description: Total number of directed connections
        averageDegree:
          type: number
          format: double
          minimum: 0
          description: Average number of connections per node
        density:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Graph density (actual connections / possible connections)

    BottleneckFinding:
      type: object
      required:
        - nodeId
        - nodeName
        - bottleneckType
        - severity
      properties:
        nodeId:
          type: string
          format: uuid
        nodeName:
          type: string
          minLength: 1
          maxLength: 200
        bottleneckType:
          type: string
          enum:
            - OverloadedNode
            - StructuralBottleneck
            - InformationSilo
          description: Type of bottleneck detected
        severity:
          type: string
          enum:
            - Low
            - Medium
            - High
            - Critical
        description:
          type: string
          maxLength: 500
          description: Human-readable explanation of the bottleneck

    ProblemDetails:
      type: object
      description: Standard HTTP error envelope compliant with RFC 9457
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          examples:
            - "https://ona.local/errors/analysis.graph_version_not_found"
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
          description: Code of the domain exception (DomainException.Code, snake_case)

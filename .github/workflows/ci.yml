name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: ona_backend_cs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ONA.sln
      - run: dotnet build ONA.sln -c Release --no-restore
      # Unit, architecture and MySQL (Testcontainers) integration tests
      - run: dotnet test ONA.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ona_backend_cs/TestResults

  docker:
    needs: test          # runs only if all tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=Graph -t ona-graph-api:${{ github.sha }} .
      - name: Smoke test (all services through the nginx proxy)
        run: |
          docker compose up -d --build
          exit_code=0
          # APIs answer 401 without a token (up and protected); the UI health answers 200.
          for spec in "api/v1/boards:401" "api/v1/users/me:401" "api/v1/analysis-runs:401" "api/v1/recommendations:401" "index.html:200"; do
            path=${spec%%:*}; want=${spec##*:}; ok=1
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/$path)
              [ "$code" = "$want" ] && ok=0 && break
              sleep 3
            done
            echo "$path -> $code (want $want) $([ $ok -eq 0 ] && echo ok || echo FAILED)"
            [ $ok -eq 0 ] || exit_code=1
          done
          docker compose logs graph-api identity-api analysis-api insights-api proxy
          docker compose down -v
          exit $exit_code
